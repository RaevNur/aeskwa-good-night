<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Весы">
  <meta name="theme-color" content="#090b17">
  <title>Созвездие Весов</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f7eae9;
      --muted: #b3b4cd;
      --rose: #f4bbd0;
      --mono: ui-monospace, "Cascadia Mono", "Menlo", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      padding: clamp(2rem, 6vw, 5rem) 1.25rem;
      display: grid;
      place-items: center;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 82% 87%, #20142d 0%, transparent 57%),
        radial-gradient(ellipse at 14% 12%, #171b37 0%, transparent 53%),
        #090b17;
      font-family: system-ui, sans-serif;
    }

    main { width: min(100%, 63rem); }

    p { margin: 0; }

    .constellation {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(16rem, 1fr);
      overflow: hidden;
      border: 1px solid #36374e;
      border-radius: 1.5rem;
      background: #111224;
      box-shadow: 0 1.6rem 5rem #04040d70;
    }

    .sky {
      position: relative;
      height: clamp(24rem, 43vw, 29rem);
      isolation: isolate;
      touch-action: pan-y pinch-zoom;
      background:
        radial-gradient(ellipse at 73% 41%, #211939 0%, transparent 59%),
        radial-gradient(ellipse at 37% 90%, #142c3e 0%, transparent 65%),
        #090c1d;
    }

    .sky canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      top: var(--y);
      left: var(--x);
      z-index: 1;
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--star-color);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: border-color 160ms ease, box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .star[hidden] { display: none; }
    .tone-star {
      position: absolute;
      z-index: 1;
      transform: translate(-50%, -50%);
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tone-star:hover, .tone-star:active { border-color: #d5c4e75c; }
    .tone-star:focus-visible { outline: 2px solid var(--paper); }

    .star:hover, .star[aria-pressed="true"] {
      border-color: currentColor;
      box-shadow: 0 0 1.6rem color-mix(in srgb, currentColor 34%, transparent);
    }

    .star:focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 4px;
    }

    .star-secret.revealed:not([data-seen]) {
      border: 1px dashed var(--star-color);
      box-shadow: 0 0 1rem #ffd8ac42;
    }

    .star-secret.revealed { animation: appear 500ms ease-out both; }

    .moon-secret {
      position: absolute;
      left: var(--moon-x, 14.5%);
      top: var(--moon-y, 23.5%);
      width: clamp(3.5rem, 8vw, 5.25rem);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      padding: 0;
      border: 1px dashed #e4cce43d;
      border-radius: 50%;
      background: radial-gradient(circle, #f4bbd00d, transparent 72%);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .moon-secret:hover, .moon-secret[aria-expanded="true"] { border-color: #e4cce49c; }
    .moon-secret:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

    .moon-wish {
      position: absolute;
      z-index: 2;
      left: var(--moon-x, 14.5%);
      top: var(--moon-y, 23.5%);
      max-width: 80%;
      transform: translateY(-50%);
      padding: .3rem .5rem;
      border-radius: .4rem;
      background: #121427f2;
      color: #ffdfec;
      font: italic clamp(1rem, 2.7vw, 1.35rem)/1.25 Georgia, serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }

    .moon-secret[aria-expanded="true"] + .moon-wish { opacity: 1; }

    .sky-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 3.65rem;
      padding: .35rem clamp(.75rem, 2.6vw, 1.5rem);
      border-top: 1px solid #36374e;
      background: #0c101f;
    }

    .sky-action {
      min-height: 2.75rem;
      padding: .25rem .56rem;
      display: inline-flex;
      align-items: center;
      gap: .37rem;
      border: 1px solid #40435d;
      border-radius: .55rem;
      color: var(--muted);
      background: #171a31;
      font: .875rem/1.15 system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    .sky-action span:first-child { color: var(--rose); }
    .sky-action:hover { color: var(--paper); }
    .sky-action[aria-pressed="true"] {
      color: var(--paper);
      border-color: #726387;
      background: #241e37;
    }
    .sky-action:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

    .audio-status {
      color: var(--muted);
      font-size: .875rem;
    }

    .audio-status:empty { display: none; }
    .audio-status:not(:empty) { padding: .5rem 1rem; }

    .note {
      display: flex;
      flex-direction: column;
      padding: clamp(1.5rem, 3.8vw, 3rem);
      border-inline-start: 1px solid #36374e;
      background: radial-gradient(ellipse at 85% 100%, #21172f, transparent 77%);
    }

    .message {
      flex: 1;
      display: grid;
      align-content: center;
      gap: 1.5rem;
      padding-block: 1rem;
    }

    .scene-art {
      margin: 0;
      color: var(--ink, var(--rose));
      font: clamp(.80rem, 1.45vw, 1rem)/1.08 var(--mono);
      inline-size: 22ch;
      min-block-size: 8lh;
      text-align: left;
      direction: ltr;
      font-kerning: none;
      font-variant-ligatures: none;
      letter-spacing: 0;
      white-space: pre;
      text-shadow: 0 0 12px color-mix(in srgb, currentColor 36%, transparent);
    }
    .scene-art .stitch { color: #a9daff; }
    .scene-art .angel { color: #f8b6d5; }

    .message p {
      min-height: 2.4em;
      font: clamp(1.45rem, 3vw, 2rem)/1.2 Georgia, serif;
      letter-spacing: -.02em;
      text-wrap: pretty;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      min-height: 2.9rem;
      border-top: 1px solid #36374e;
    }

    #save-wallpaper { text-decoration: none; }
    #save-wallpaper[hidden] { display: none; }

    .marks {
      display: flex;
      align-items: center;
      gap: .25rem;
      min-height: 2.3rem;
      color: var(--rose);
    }

    .marks i {
      display: inline-grid;
      place-items: center;
      width: .78rem;
      height: 1.4rem;
      color: var(--letter-color, var(--rose));
      font: 600 .87rem/1 var(--mono);
    }
    .marks i[hidden] { display: none; }
    .marks i:empty::after {
      content: "";
      width: .27rem;
      height: .27rem;
      border: 1px solid #9292aa;
      border-radius: 50%;
    }
    .marks i.lit { text-shadow: 0 0 .55rem currentColor; }
    .marks span { font-size: .875rem; color: var(--muted); }
    .marks span:empty { display: none; }

    .mixtape {
      display: flex;
      width: 100%;
      min-height: 2.9rem;
      align-items: center;
      gap: .55rem;
      margin: .25rem 0 .55rem;
      padding: .4rem .65rem;
      border: 1px solid #62536b;
      border-radius: .45rem;
      background: linear-gradient(105deg, #332739, #221e31 78%);
      color: #f0d7db;
      font: .85rem/1.1 system-ui, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .mixtape[hidden] { display: none; }
    .mixtape:hover { border-color: #b99aa9; }
    .mixtape:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
    .mixtape strong { font-weight: 550; }
    .tape-bars {
      display: inline-flex;
      height: 1.1rem;
      align-items: center;
      gap: 2px;
    }
    .tape-bars i { width: 3px; border-radius: 2px; }
    .tape-bars i.current { outline: 1px solid #fff5f0; box-shadow: 0 0 5px #fff5f0; }
    .tape-action { margin-left: auto; white-space: nowrap; }
    .progress {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    .noscript {
      position: absolute;
      inset: auto 1rem 1rem;
      color: var(--paper);
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Use the currently visible viewport in Safari and the full window on the Home Screen. */
    @media (max-width: 42rem), (orientation: landscape) and (max-width: 64rem) and (max-height: 34rem) and (pointer: coarse) {
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        background: #090c1d;
      }
      body { display: block; padding: 0; }
      main { width: 100%; }
      .constellation {
        min-height: 100vh;
        min-height: 100dvh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 1fr auto;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
      }
      .sky-panel { display: flex; flex-direction: column; min-width: 0; }
      .sky {
        flex: 1;
        height: auto;
        min-height: calc(14rem + var(--safe-top));
        padding: var(--safe-top) var(--safe-right) 0 var(--safe-left);
      }
      .sky-toolbar {
        min-height: 3.25rem;
        padding: .2rem max(.75rem, var(--safe-right)) .2rem max(.75rem, var(--safe-left));
      }
      .note {
        min-width: 0;
        /* Keep star positions stable as captions wrap and the cassette appears. */
        min-height: calc(8.7rem + max(5.5rem, 22vw) + max(.25rem, var(--safe-bottom)));
        padding: .6rem max(1rem, var(--safe-right)) max(.25rem, var(--safe-bottom)) max(1rem, var(--safe-left));
        border-inline-start: 0;
        border-block-start: 1px solid #36374e;
      }
      .message {
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: .7rem;
        padding-block: .4rem .8rem;
      }
      .scene-art { font-size: clamp(.58rem, 2.55vw, .84rem); }
      .message p { min-height: 0; font-size: clamp(1.13rem, 4.9vw, 1.55rem); }
      .marks { min-height: 1.75rem; }
    }

    @media (orientation: landscape) and (max-width: 64rem) and (max-height: 34rem) and (pointer: coarse) {
      .constellation { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); grid-template-rows: 1fr; }
      .sky { min-height: 12.5rem; padding-right: 0; }
      .sky-toolbar { padding-right: .75rem; padding-bottom: max(.2rem, var(--safe-bottom)); }
      .note {
        min-height: 0;
        padding: max(.65rem, var(--safe-top)) max(1rem, var(--safe-right)) max(.5rem, var(--safe-bottom)) .9rem;
        border-block-start: 0;
        border-inline-start: 1px solid #36374e;
      }
      .message { grid-template-columns: minmax(0, 1fr); gap: .6rem; }
      .scene-art { font-size: clamp(.6rem, 1.55vw, .88rem); }
      .message p { font-size: clamp(1.06rem, 2.6vw, 1.48rem); }
    }

    @media (orientation: portrait) and (max-width: 42rem) and (max-height: 34rem) {
      .sky { min-height: calc(11.25rem + var(--safe-top)); }
      .sky-toolbar { min-height: 2.85rem; padding-block: 0; }
      .note {
        min-height: calc(7rem + max(4.5rem, 20vw) + max(.25rem, var(--safe-bottom)));
        padding-top: .25rem;
      }
      .message { padding-block: .22rem; }
      .message p { font-size: 1.05rem; }
      .scene-art { font-size: .55rem; }
      .mixtape { min-height: 2.75rem; margin-block: .125rem .25rem; }
    }

    @media (orientation: landscape) and (max-width: 64rem) and (max-height: 21rem) and (pointer: coarse) {
      .message { padding-block: .2rem; gap: .35rem; }
      .message p { font-size: 1.05rem; }
      .scene-art { font-size: clamp(.55rem, 1.2vw, .68rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Музыкальная открытка">
    <section class="constellation" aria-label="Созвездие Весов">
      <div class="sky-panel">
        <div class="sky">
          <canvas aria-hidden="true"></canvas>
          <button class="star" type="button" aria-label="Альфа-2 Весов — открыть звезду" title="Альфа-2 Весов" aria-pressed="false"
            style="--x: 72%; --y: 44%; --star-color: #b6d0ff"></button>
          <button class="star" type="button" aria-label="Бета Весов — открыть звезду" title="Бета Весов" aria-pressed="false"
            style="--x: 53%; --y: 21%; --star-color: #f5b8d2"></button>
          <button class="star" type="button" aria-label="Гамма Весов — открыть звезду" title="Гамма Весов" aria-pressed="false"
            style="--x: 39%; --y: 40%; --star-color: #d2c1ff"></button>
          <button class="star" type="button" aria-label="Сигма Весов — открыть звезду" title="Сигма Весов" aria-pressed="false"
            style="--x: 62%; --y: 77%; --star-color: #ffd8ac"></button>
          <button class="star star-secret" type="button" aria-label="Ню Весов — открыть звезду" title="Ню Весов" aria-pressed="false"
            style="--x: 28%; --y: 49%; --star-color: #9ee7d9" hidden></button>
          <button class="moon-secret" type="button" aria-label="Открыть секрет месяца" title="Секрет месяца" aria-controls="moon-wish" aria-expanded="false"></button>
          <span class="moon-wish" id="moon-wish" role="status"></span>
          <noscript><p class="noscript">Включи JavaScript, чтобы открыть звёзды.</p></noscript>
        </div>
        <div class="sky-toolbar">
          <button class="sky-action" id="music" type="button" aria-pressed="false"
            aria-label="Музыка и ноты звёзд" title="Включить мелодию и играть на звёздах">
            <span aria-hidden="true">♪</span><span>Звук звёзд</span>
          </button>
          <button class="sky-action" id="motion" type="button" aria-pressed="true">
            <span aria-hidden="true">~</span><span>Движение</span>
          </button>
        </div>
        <p class="audio-status" role="status"></p>
      </div>

      <div class="note">
        <div class="message" aria-live="polite" aria-atomic="true">
          <pre class="scene-art" aria-hidden="true"></pre>
          <p>Коснись звезды</p>
        </div>
        <button id="replay" class="mixtape" type="button" aria-label="Послушать свои последние ноты" hidden>
          <strong>Твоя кассета</strong>
          <span class="tape-bars" aria-hidden="true"></span>
          <span class="tape-action" aria-hidden="true">▷ Слушать</span>
        </button>
        <div class="note-footer">
          <div class="marks" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i hidden></i><span></span>
          </div>
          <a class="sky-action" id="save-wallpaper" download="libra.png" hidden>Сохранить обои</a>
        </div>
        <p class="audio-status" id="wallpaper-status" role="status"></p>
        <p class="progress" role="status">Открыто 0 из 4</p>
      </div>
    </section>
  </main>

    const scenes = [

    const sky = document.querySelector(".sky");
    const canvas = sky.querySelector("canvas");
    const context = canvas.getContext("2d");
    const stars = Array.from(sky.querySelectorAll(".star"));

    const motion = document.querySelector("#motion");

    const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");

    // The embedded table is a filtered and rounded HYG derivative, licensed CC BY-SA 4.0.

    // License: https://creativecommons.org/licenses/by-sa/4.0/
    // Columns: right ascension (degrees), declination (degrees), apparent V magnitude, HIP, designation.
    const anchors = [
      [222.719655, -16.041778, 2.75, 72622, "Zubenelgenubi"],
      [229.251735, -9.382917, 2.61, 74785, "Zubeneschamali"],

    ];
    // The IAU OAE / Sky & Telescope chart, oriented north up and east left:
    // https://www.astro4edu.org/resources/diagram/9P17by35Gr8/
    // Its six guide stars form a triangle and two hanging arms. The three
    // additional catalog stars sit along its crossbar and the two arms.
    const edges = [[0, 1], [1, 2], [2, 4], [4, 0], [0, 6], [6, 3], [2, 5], [5, 7], [7, 8]];
    const figureLabels = [[0, "α²", 19, -5], [1, "β", 16, -7], [2, "γ", -16, -8],
                          [3, "σ", 15, 1], [7, "υ", -14, -4], [8, "τ", -14, 5]];
    let view;
    let elapsed = 0;
    let lastFrame = null;
    let animationFrame = 0;
    let motionEnabled = !motionPreference.matches;
    let sceneIndex = 0;
    let sceneStarted = 0;
    let lastDrawing = "";
    let burst = null;
    const trail = [];
    let lastTrailPoint = null;

    function drawScene() {
      const scene = scenes[sceneIndex];
      const age = elapsed - sceneStarted;
      const phase = age % 3.3;
      const alternate = motionEnabled && phase > .6 && phase < 1.25;
      const rows = scene.still.map((row, index) => (alternate ? (scene.blink[index] ?? row) : row).padEnd(22));
      const frame = rows.join("\n");
      if (frame !== lastDrawing) {
        if (scene.duet) {
          const fragment = document.createDocumentFragment();
          rows.forEach((row, index) => {
            if (index) fragment.append("\n");
            const stitch = document.createElement("span");
            const angel = document.createElement("span");
            stitch.className = "stitch";
            angel.className = "angel";
            stitch.textContent = row.slice(0, 11);
            angel.textContent = row.slice(11);
            fragment.append(stitch, angel);
          });
          drawing.replaceChildren(fragment);
        } else {
          drawing.textContent = frame;
        }
        lastDrawing = frame;
      }
    }

    function traceSky(event) {
      if (!motionEnabled || !view || !event.isPrimary || event.target.closest("button")) {
        lastTrailPoint = null;
        return;
      }
      const bounds = sky.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      const y = event.clientY - bounds.top;
      const from = lastTrailPoint ?? { x, y };
      const distance = Math.hypot(x - from.x, y - from.y);
      if (lastTrailPoint && distance < 5) return;
      const steps = Math.max(1, Math.min(20, Math.ceil(distance / 6)));
      for (let i = 1; i <= steps; i++) {
        const fraction = i / steps;
        trail.push({ x: from.x + (x - from.x) * fraction, y: from.y + (y - from.y) * fraction, born: elapsed });
      }
      if (trail.length > 64) trail.splice(0, trail.length - 64);
      lastTrailPoint = { x, y };
    }

    function drawTouches() {
      while (trail.length && elapsed - trail[0].born >= 1.15) trail.shift();
      context.fillStyle = "#f4d1e1";
      trail.forEach((point, index) => {
        const age = elapsed - point.born;
        context.globalAlpha = (1 - age / 1.15) * .95;
        context.fillText(index === trail.length - 1 ? "*" : index % 5 === 0 ? "+" : ".", point.x, point.y + age * 6);
      });

      if (!burst) return;
      const age = elapsed - burst.born;
      if (age >= .9) {
        burst = null;
        return;
      }
      const { x, y } = view.points[burst.star];
      const spread = 14 + 44 * age;
      context.globalAlpha = 1 - age / .9;
      for (let i = 0; i < 12; i++) {
        const angle = i * Math.PI / 6;
        context.fillText(i % 3 === 0 ? "+" : ".", x + Math.cos(angle) * spread, y + Math.sin(angle) * spread);
      }
    }


    function createFigureView(width, height, left = 0, top = 0, right = 0) {
      const safeWidth = width - left - right;
      const safeHeight = height - top;
      const radians = Math.PI / 180;
      const ra0 = 229 * radians, dec0 = -19 * radians;
      const coordinates = anchors.map(row => {
        const east = row[0] * radians - ra0;
        const dec = row[1] * radians;
        const depth = Math.sin(dec0) * Math.sin(dec) + Math.cos(dec0) * Math.cos(dec) * Math.cos(east);
        return {
          x: -Math.cos(dec) * Math.sin(east) / depth,
          y: (Math.sin(dec0) * Math.cos(dec) * Math.cos(east) - Math.cos(dec0) * Math.sin(dec)) / depth,
          row
        };
      });
      const xs = coordinates.map(p => p.x), ys = coordinates.map(p => p.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const unit = Math.min((safeWidth - 70) / (x1 - x0), (safeHeight - 74) / (y1 - y0));
      const points = coordinates.map(({ x, y, row }) => ({
        x: left + safeWidth * .52 + (x - (x1 + x0) / 2) * unit,
        y: top + safeHeight * .5 + (y - (y1 + y0) / 2) * unit,
        row
      }));
      return { width, height, points, moonX: left + safeWidth * .145, moonY: top + safeHeight * .235 };
    }

    const tones = ["41 Весов", "HIP 73184", "Ипсилон Весов", "Тау Весов"].map((name, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tone-star";
      button.setAttribute("aria-label", name + " — сыграть ноту");
      button.title = name;
      button.addEventListener("click", () => {
        const star = stars.length + index;
        burst = motionEnabled ? { star, born: elapsed } : null;
        drawSky();
        void playStarNote(star);
      });
      sky.append(button);
      return button;
    });

    function placeToneButtons(points) {
      tones.forEach((button, index) => {
        const point = points[stars.length + index];
        let x = point.x, y = point.y;
        // Separate the touch targets of close pairs. Glyphs retain their catalog positions.
        for (const neighbor of points) {
          if (point === neighbor) continue;
          const dx = point.x - neighbor.x, dy = point.y - neighbor.y;
          const distance = Math.hypot(dx, dy);
          if (distance < 48 && distance > 0) {
            const shift = (48 - distance) / (2 * distance);
            x += dx * shift;
            y += dy * shift;
          }
        }
        button.style.left = x + "px";
        button.style.top = y + "px";
      });
    }

    function resizeSky() {
      const { width, height } = sky.getBoundingClientRect();
      const padding = getComputedStyle(sky);
      view = createFigureView(width, height, parseFloat(padding.paddingLeft), parseFloat(padding.paddingTop), parseFloat(padding.paddingRight));
      sky.style.setProperty("--moon-x", view.moonX + "px");
      sky.style.setProperty("--moon-y", view.moonY + "px");
      placeToneButtons(view.points);
      stars.forEach((star, index) => {
        star.style.setProperty("--x", view.points[index].x + "px");
        star.style.setProperty("--y", view.points[index].y + "px");
      });
      if (!context) return;

      const scale = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      context.setTransform(scale, 0, 0, scale, 0, 0);
      drawSky();
    }

    // The decorative grid is stable across frames and screen layouts.
    function drawBackdrop(context, projection, elapsed) {
      const { width, height } = projection;
      if (!projection.backdropCells) {
        const cells = [];
        let seed = 83;
        for (let y = 7; y < height; y += 9) {
          for (let x = 4; x < width; x += 7) {
            seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
            cells.push({ x, y, shade: seed / 4294967296 });
          }
        }
        projection.backdropCells = cells;
      }

      context.clearRect(0, 0, width, height);
      context.font = "10px monospace";
      context.textAlign = "center";
      context.textBaseline = "middle";

      const moonX = projection.moonX + 3 * Math.sin(elapsed * .23);
      const moonY = projection.moonY + 3 * Math.cos(elapsed * .32);
      const moonRadius = Math.min(width, height) * .092;
      const waveGlyphs = " .,:;*";

      for (const { x, y, shade } of projection.backdropCells) {
        const u = x / width;
        const v = y / height;
        const ribbon = .76 - .38 * u + .13 * Math.sin(u * 7.3 - elapsed * .65);
        const fold = ribbon + .085 * Math.sin(u * 11 + elapsed * .51) + .13;
        const light = Math.max(
          .83 * Math.exp(-52 * (v - ribbon) ** 2),
          .57 * Math.exp(-107 * (v - fold) ** 2)
        );

        if (Math.hypot(x - moonX, y - moonY) < moonRadius) {
          const shadow = Math.hypot(x - moonX - moonRadius * .43, y - moonY + moonRadius * .22);
          if (shadow > moonRadius * .87) {
            context.fillStyle = "#e8cdea";
            context.globalAlpha = .6 + shade * .35;
            context.fillText(".:+*"[Math.floor(shade * 4)], x, y);
          }
        } else if (shade > .86) {
          const pulse = .5 + .5 * Math.sin(elapsed * (1.4 + shade) + x * .17 + y * .08);
          context.fillStyle = "#d4dcff";
          context.globalAlpha = .23 + pulse * .58;
          context.fillText(shade > .988 ? "+" : shade > .97 ? ":" : ".", x, y);
        } else if (shade < light * .68) {
          const shimmer = .5 + .5 * Math.sin(u * 17 - elapsed * 1.3 + v * 21);
          const strength = light * (.46 + .54 * shimmer);
          context.fillStyle = u < .51 ? "#91dcdf" : "#caa0ed";
          context.globalAlpha = strength * (.41 + shade * .48);
          context.fillText(waveGlyphs[Math.min(5, Math.floor(strength * 6))], x, y);
        }
      }
      context.globalAlpha = 1;
    }

    // Each stroke is made of typewriter hyphens laid end to end along the sky path.
    function drawFigure(ink, points, time) {
      ink.save();
      ink.font = "bold 12px monospace";
      ink.textAlign = "center";
      ink.textBaseline = "middle";
      const dashWidth = ink.measureText("-").width;
      for (const [a, b] of edges) {
        const from = points[a], to = points[b];
        const dx = to.x - from.x, dy = to.y - from.y;
        const length = Math.hypot(dx, dy);
        const cells = Math.max(1, Math.round((length - 12) / (dashWidth * .82)));
        ink.save();
        ink.translate(from.x, from.y);
        ink.rotate(Math.atan2(dy, dx));
        // A quiet continuous underprint keeps shallow diagonals legible at phone size.
        ink.fillStyle = "#a99cbe";
        ink.globalAlpha = .42;
        ink.fillRect(5, -.4, length - 10, .8);
        ink.fillStyle = "#e2cace";
        ink.globalAlpha = .83;
        for (let cell = 0; cell < cells; cell++) {
          ink.fillText("-", 6 + (cell + .5) * (length - 12) / cells, 0);
        }
        ink.restore();
      }
      points.forEach(({x, y, row}, index) => {
        const size = Math.max(12, 27 - 3 * row[2]);
        const accent = index < stars.length ? stars[index].style.getPropertyValue("--star-color") : "#d6cfe9";
        const pulse = .93 + .07 * Math.sin(time * 1.35 + index * 1.7);
        const halo = ink.createRadialGradient(x, y, 1, x, y, size * .92);
        halo.addColorStop(0, accent + "53");
        halo.addColorStop(1, accent + "00");
        ink.fillStyle = halo;
        ink.fillRect(x - size, y - size, size * 2, size * 2);
        ink.fillStyle = accent;
        ink.globalAlpha = pulse;
        ink.font = "bold " + size + "px monospace";
        ink.shadowBlur = 5;
        ink.shadowColor = accent;
        ink.fillText("+", x, y);
        ink.shadowBlur = 0;
        if (row[2] < 4.2) {
          ink.font = "9px monospace";
          ink.fillText("-", x - size * .4, y);
          ink.fillText("-", x + size * .4, y);
          ink.fillText("|", x, y - size * .40);
          ink.fillText("|", x, y + size * .40);
        }
        ink.fillStyle = "#fff5e7";
        ink.fillRect(x - 1, y - 1, 2, 2);
      });
      ink.globalAlpha = 1;
      ink.font = "italic 13px Georgia, serif";
      ink.lineWidth = 3;
      ink.strokeStyle = "#111325";
      ink.fillStyle = "#d1c7dd";
      for (const [index, label, dx, dy] of figureLabels) {
        const { x, y } = points[index];
        ink.strokeText(label, x + dx, y + dy);
        ink.fillText(label, x + dx, y + dy);
      }
      ink.restore();
    }

    function drawStarfield(context, projection, elapsed) {
      const { width, height, points } = projection;
      drawBackdrop(context, projection, elapsed);
      drawFigure(context, points, elapsed);
      const meteor = (elapsed + 6.5) % 8.5;
      if (meteor < 1.65) {
        const advance = meteor / 1.65;
        const x = width * (.92 - advance * .58);
        const y = height * (.08 + advance * .37);
        const brightness = Math.sin(advance * Math.PI);
        for (let tail = 5; tail >= 0; tail--) {
          context.fillStyle = "#f6d4df";
          context.globalAlpha = brightness * (1 - tail / 6);
          context.fillText(tail === 0 ? "*" : ".", x + tail * 6, y - tail * 3);
        }
      }
      context.globalAlpha = 1;
    }

    function drawSky() {
      if (!context || !view) return;
      drawStarfield(context, view, elapsed);
      drawTouches();
      context.globalAlpha = 1;
      drawScene();
    }

    function renderWallpaper() {
      const picture = document.createElement("canvas");
      picture.width = 1080;
      picture.height = 1920;
      const ink = picture.getContext("2d");
      if (!ink) throw new Error("Canvas unavailable");
      const portrait = createFigureView(360, 640);
      ink.scale(3, 3);
      drawStarfield(ink, portrait, elapsed);
      // Set the five discovered letters in a small dot-matrix signature.
      const type = {
        А: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
        С: ["01111", "10000", "10000", "10000", "10000", "10000", "01111"],
        Е: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
        К: ["10001", "10010", "10100", "11000", "10100", "10010", "10001"]
      };
      ink.font = "4px monospace";
      ink.textAlign = "center";
      ink.textBaseline = "middle";
      [...signature].forEach((letter, index) => {
        ink.fillStyle = stars[index].style.getPropertyValue("--star-color");
        type[letter].forEach((line, row) => {
          for (let col = 0; col < line.length; col++) {
            if (line[col] === "1") ink.fillText("+", 256 + (index * 6 + col) * 2.3, 565 + row * 2.3);
          }
        });
      });
      ink.globalCompositeOperation = "destination-over";
      const background = ink.createLinearGradient(0, 0, 250, 640);
      background.addColorStop(0, "#0a0e20");
      background.addColorStop(.48, "#211a36");
      background.addColorStop(.78, "#142638");
      background.addColorStop(1, "#0a0d1c");
      ink.fillStyle = background;
      ink.fillRect(0, 0, 360, 640);
      return picture;
    }

    const wallpaperLink = document.querySelector("#save-wallpaper");
    const wallpaperStatus = document.querySelector("#wallpaper-status");
    let wallpaperBlob;
    let preparingWallpaper = false;

    // Preserve the sky-data attribution inside the downloadable image.
    function creditWallpaper(png) {
      const credit = "Copyright\0Star positions adapted from HYG v4.4, David Nash / Astronexus, https://codeberg.org/astronexus/hyg . Sky chart: CC BY-SA 4.0, https://creativecommons.org/licenses/by-sa/4.0/ . Figure based on the Libra chart by IAU OAE / IAU and Sky & Telescope (https://www.astro4edu.org/resources/diagram/9P17by35Gr8/ , CC BY 4.0), redrawn with three added stars along the chart lines.";
      const payload = new TextEncoder().encode("tEXt" + credit);
      const chunk = new Uint8Array(payload.length + 8);
      const metadata = new DataView(chunk.buffer);
      metadata.setUint32(0, payload.length - 4);
      chunk.set(payload, 4);
      let crc = 0xffffffff;
      for (const byte of payload) {
        crc ^= byte;
        for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
      }
      metadata.setUint32(chunk.length - 4, (crc ^ 0xffffffff) >>> 0);
      // PNG signature and the mandatory IHDR occupy the first 33 bytes.
      return new Blob([png.slice(0, 33), chunk, png.slice(33)], { type: "image/png" });
    }

    async function unlockWallpaper() {
      if (wallpaperBlob || preparingWallpaper) return;
      preparingWallpaper = true;
      try {
        const picture = renderWallpaper();
        const blob = await new Promise(resolve => picture.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("PNG unavailable");
        wallpaperBlob = creditWallpaper(blob);
        wallpaperLink.href = URL.createObjectURL(wallpaperBlob);
        wallpaperLink.hidden = false;
        wallpaperStatus.textContent = "";
      } catch {
        wallpaperStatus.textContent = "Не удалось создать обои. Коснись звезды ещё раз.";
      } finally {
        preparingWallpaper = false;
      }
    }

    wallpaperLink.addEventListener("click", async event => {
      if (!navigator.canShare || !navigator.share || !matchMedia("(pointer: coarse)").matches) return;
      const file = new File([wallpaperBlob], "libra.png", { type: "image/png" });
      const data = { files: [file] };
      if (!navigator.canShare(data)) return;
      event.preventDefault();
      try {
        // The PNG is ready before the tap, so native sharing keeps its user gesture on iOS.
        await navigator.share(data);
      } catch (error) {
        if (error.name === "AbortError") return;
        const download = document.createElement("a");
        download.href = wallpaperLink.href;
        download.download = wallpaperLink.download;
        document.body.append(download);
        download.click();
        download.remove();
      }
    });

    function animate(now) {
      if (lastFrame === null) lastFrame = now;
      if (now - lastFrame >= 43) {
        elapsed += Math.min(.1, (now - lastFrame) / 1000);
        lastFrame = now;
        drawSky();
      }
      animationFrame = requestAnimationFrame(animate);
    }

    function syncMotion() {
      cancelAnimationFrame(animationFrame);
      lastFrame = null;
      motion.setAttribute("aria-pressed", String(motionEnabled));
      if (!motionEnabled) {
        trail.length = 0;
        lastTrailPoint = null;
        burst = null;
        drawScene();
        drawSky();
      }
      if (motionEnabled && !document.hidden && context) {
        animationFrame = requestAnimationFrame(animate);
      }
    }

    function openStar(index) {
      const memory = memories[index];
      opened.add(index);
      stars.forEach((star, position) => {
        star.setAttribute("aria-pressed", String(position === index));
        star.toggleAttribute("data-seen", opened.has(position));
      });

      sceneIndex = index + 1;
      sceneStarted = elapsed;
      burst = motionEnabled ? { star: index, born: elapsed } : null;
      drawing.style.setProperty("--ink", stars[index].style.getPropertyValue("--star-color"));
      message.textContent = memory;
      marks[index].textContent = signature[index];
      marks[index].style.setProperty("--letter-color", stars[index].style.getPropertyValue("--star-color"));
      marks[index].classList.add("lit");
      drawScene();

      if (opened.size === stars.length - 1 && secret.hidden) {
        secret.hidden = false;
        secret.classList.add("revealed");
        marks[marks.length - 1].hidden = false;
      }
      drawSky();
      hint.textContent = opened.size === stars.length - 1 ? "Ещё одна звезда" : "";

      if (opened.size === stars.length) {
        progress.textContent = "Все звёзды открыты";
        const nameplate = marks[0].parentElement;
        nameplate.removeAttribute("aria-hidden");
        nameplate.setAttribute("role", "img");
        nameplate.setAttribute("aria-label", "Из пяти звёзд сложилось имя Асека");
        unlockWallpaper();
      } else if (opened.size === stars.length - 1) {
        progress.textContent = "Открылась ещё одна звезда";
      } else {
        progress.textContent = "Открыто " + opened.size + " из " + (stars.length - 1);
      }
    }

    const starNotes = [440, 523.25, 659.25, 783.99, 880, 293.66, 329.63, 349.23, 392];
    let noteContext = null;
    let noteOutput = null;

    function connectStarInstrument(context) {
      // Preserve quiet notes and leave headroom when several keys ring together.
      const limit = context.createWaveShaper();
      limit.curve = Float32Array.from({ length: 1025 }, (_, i) => {
        const x = (i - 512) / 512;
        const level = Math.abs(x);
        if (level <= .5) return x;
        return Math.sign(x) * (.5 + .25 * Math.tanh((level - .5) / .25));
      });
      limit.connect(context.destination);
      return limit;
    }

    function strikeStar(context, output, index, when) {
      const voice = context.createOscillator();
      const envelope = context.createGain();
      voice.type = "triangle";
      voice.frequency.value = starNotes[index];
      envelope.gain.setValueAtTime(0, when);
      envelope.gain.linearRampToValueAtTime(.25, when + .014);
      envelope.gain.exponentialRampToValueAtTime(.083, when + .24);
      envelope.gain.exponentialRampToValueAtTime(.0001, when + .85);
      voice.connect(envelope).connect(output);
      voice.onended = () => {
        voice.disconnect();
        envelope.disconnect();
      };
      voice.start(when);
      voice.stop(when + .86);
    }

    function muteStarNotes() {
      if (!noteContext) return;
      const context = noteContext;
      noteContext = null;
      noteOutput = null;
      void context.close().catch(() => {});
    }

    async function playStarNote(index) {
      if (soundtrack.paused) return;
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;

      try {
        const context = noteContext ??= new Audio();
        if (context.state !== "running") await context.resume();
        if (context !== noteContext || soundtrack.paused) return;

        noteOutput ??= connectStarInstrument(context);
        strikeStar(context, noteOutput, index, context.currentTime);
      } catch {
        if (!soundtrack.paused) audioStatus.textContent = "Не удалось сыграть ноту.";
      }
    }

    stars.forEach((star, index) => star.addEventListener("click", () => playStarNote(index)));

    music.addEventListener("click", async () => {
      audioStatus.textContent = "";
      if (!soundtrack.paused) {
        muteStarNotes();
        soundtrack.pause();
        return;
      }
      try {
        await soundtrack.play();
      } catch (error) {
        if (error.name !== "AbortError") audioStatus.textContent = "Не удалось включить музыку.";
      }
    });
    soundtrack.addEventListener("playing", () => music.setAttribute("aria-pressed", "true"));
    soundtrack.addEventListener("pause", () => {
      if (!soundtrack.paused) return;
      muteStarNotes();
      music.setAttribute("aria-pressed", "false");
    });
    motion.addEventListener("click", () => {
      motionEnabled = !motionEnabled;
      syncMotion();
    });
    motionPreference.addEventListener("change", event => {
      motionEnabled = !event.matches;
      syncMotion();
    });
    document.addEventListener("visibilitychange", syncMotion);

    const replay = document.querySelector("#replay");
    const tapeBars = replay.querySelector(".tape-bars");
    const tapeAction = replay.querySelector(".tape-action");
    const phrase = [];
    const keys = [...stars, ...tones];
    let replayTimer = null;
    let playingStep = -1;

    function stopReplay() {
      clearTimeout(replayTimer);
      replayTimer = null;
      playingStep = -1;
      tapeBars.querySelector(".current")?.classList.remove("current");
      tapeAction.textContent = "▷ Слушать";
      replay.setAttribute("aria-label", "Послушать свои последние ноты");
    }

    // Record only the player's own taps. Replay highlights and notes never enter the buffer.
    sky.addEventListener("click", event => {
      const key = keys.indexOf(event.target.closest("button"));
      if (key < 0 || soundtrack.paused) return;
      if (playingStep !== -1) stopReplay();
      phrase.push({ key, time: performance.now() });
      if (phrase.length > 9) phrase.shift();
      const bar = document.createElement("i");
      bar.style.background = stars[key]?.style.getPropertyValue("--star-color") || "#d6cfe9";
      bar.style.height = (4 + 11 * Math.log2(starNotes[key] / 293.66)) + "px";
      tapeBars.append(bar);
      if (tapeBars.childElementCount > 9) tapeBars.firstElementChild.remove();
      replay.hidden = phrase.length < 2;
    }, true);

    function replayStep(index) {
      if (soundtrack.paused || document.hidden) {
        stopReplay();
        return;
      }
      if (playingStep !== -1) tapeBars.children[playingStep].classList.remove("current");
      playingStep = index;
      const { key, time } = phrase[index];
      tapeBars.children[index].classList.add("current");
      burst = motionEnabled ? { star: key, born: elapsed } : null;
      drawSky();
      void playStarNote(key);
      const next = phrase[index + 1];
      replayTimer = next
        ? setTimeout(() => replayStep(index + 1), Math.min(1200, next.time - time))
        : setTimeout(stopReplay, 550);
    }

    replay.addEventListener("click", () => {
      if (playingStep !== -1) {
        stopReplay();
        return;
      }
      if (phrase.length < 2 || soundtrack.paused) return;
      tapeAction.textContent = "□ Стоп";
      replay.setAttribute("aria-label", "Остановить кассету");
      replayStep(0);
    });
    soundtrack.addEventListener("playing", () => { replay.hidden = phrase.length < 2; });
    soundtrack.addEventListener("pause", () => {
      stopReplay();
      replay.hidden = true;
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopReplay();
    });

    const moonButton = sky.querySelector(".moon-secret");
    const moonWish = sky.querySelector(".moon-wish");
    let moonTimer;
    moonButton.addEventListener("click", () => {
      clearTimeout(moonTimer);
      moonButton.setAttribute("aria-expanded", "true");
      moonWish.textContent = "Спокойной ночи, Асека";
      moonTimer = setTimeout(() => {
        moonButton.setAttribute("aria-expanded", "false");
        moonTimer = setTimeout(() => { moonWish.textContent = ""; }, 250);
      }, 4800);
    });

    sky.addEventListener("pointerdown", event => {
      lastTrailPoint = null;
      traceSky(event);
    });
    sky.addEventListener("pointermove", traceSky);
    for (const type of ["pointerleave", "pointerup", "pointercancel"]) {
      sky.addEventListener(type, () => { lastTrailPoint = null; });
    }
    drawScene();
    stars.forEach((star, index) => star.addEventListener("click", () => openStar(index)));
    new ResizeObserver(resizeSky).observe(sky);
    resizeSky();
    syncMotion();
  </script>
</body>
</html>
